<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgroSynth — المساعد الفلاحي الذكي</title>
<link rel="icon" href="https://agro-synth.github.io/AgroSynth/1000007537.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101010; --panel:#171717; --panel-2:#1d1d1b; --panel-3:#232321;
  --line:rgba(255,255,255,.085); --line-strong:rgba(255,255,255,.14);
  --text:#f4f1eb; --muted:#a5a29b; --dim:#72716c;
  --accent:#d97757; --accent-2:#e58b6c; --accent-soft:rgba(217,119,87,.12);
  --green:#72b28a; --danger:#ef6b6b; --shadow:0 20px 70px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#f7f7f5; --panel:#fff; --panel-2:#f1f0ec; --panel-3:#e9e8e3;
  --line:rgba(0,0,0,.08); --line-strong:rgba(0,0,0,.14);
  --text:#1a1917; --muted:#66645f; --dim:#96938c;
  --accent:#c45f3d; --accent-2:#d26f4d; --accent-soft:rgba(196,95,61,.10);
  --green:#4f8b68; --danger:#c74747; --shadow:0 20px 60px rgba(35,31,26,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{font-family:'Noto Sans Arabic','Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:17px;height:17px;flex-shrink:0}

.app{height:100%;display:flex;background:var(--bg)}
.sidebar{width:272px;background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px;gap:10px;flex-shrink:0}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#9f4f37);display:grid;place-items:center;color:#fff;overflow:hidden;flex-shrink:0}
.mark img{width:100%;height:100%;object-fit:cover}
.new-chat{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;font-weight:600;transition:.18s}
.new-chat:hover{background:var(--panel-3);border-color:var(--line-strong)}
.side-title{font-size:11px;color:var(--dim);padding:8px 8px 6px;font-weight:700}
.sessions{flex:1;overflow-y:auto;display:grid;gap:2px;align-content:start}
.srow{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:9px;font-size:13px;color:var(--muted);cursor:pointer}
.srow:hover{background:var(--panel-2);color:var(--text)}
.srow.active{background:var(--accent-soft);color:var(--text)}
.stitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdel{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--dim);opacity:0}
.srow:hover .sdel{opacity:1}
.sdel:hover{background:var(--panel-3);color:var(--danger)}
.sdel svg{width:13px;height:13px}
.empty-note{font-size:12px;color:var(--dim);padding:6px 10px}
.side-footer{border-top:1px solid var(--line);padding-top:10px}
.side-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:10px;color:var(--muted);font-size:13px}
.side-item:hover{background:var(--panel-2);color:var(--text)}

.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);flex-shrink:0}
.model{display:flex;align-items:center;gap:10px}
.model-btn{height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:700;font-size:13px;display:flex;align-items:center}
.live{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(114,178,138,.1)}
.icon-btn{width:36px;height:36px;border-radius:9px;color:var(--muted);display:grid;place-items:center;border:1px solid transparent}
.icon-btn:hover{background:var(--panel);border-color:var(--line);color:var(--text)}
.menu-btn{display:none}

.chat{flex:1;overflow-y:auto;scroll-behavior:smooth}
.chat-inner{max-width:900px;margin:0 auto;padding:48px 28px 160px}
.welcome{max-width:760px;margin:50px auto 22px;text-align:center}
.kicker{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.6px;margin-bottom:12px}
.welcome h2{font-size:34px;line-height:1.3;margin-bottom:13px;font-weight:700}
.welcome p{font-size:14px;color:var(--muted);line-height:1.9;max-width:640px;margin:0 auto}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid var(--line);background:var(--panel);border-radius:999px;color:var(--muted);font-size:12.5px;transition:.18s}
.chip:hover{color:var(--text);border-color:var(--line-strong);background:var(--panel-2)}
.chip svg{width:14px;height:14px}

.msg{display:flex;gap:12px;max-width:860px;margin:0 auto 28px;animation:in .3s ease}
.msg.user{flex-direction:row-reverse}
.avatar{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;margin-top:3px;background:var(--panel-3);overflow:hidden}
.msg.bot .avatar{background:linear-gradient(135deg,var(--accent),#9f4f37);color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover}
.bubble{font-size:14.5px;line-height:1.9;word-break:break-word;max-width:min(760px,calc(100vw - 150px))}
.msg.user .bubble{background:var(--panel-2);border:1px solid var(--line);padding:11px 15px;border-radius:14px}
.msg.err .bubble{padding:11px 14px;border-radius:12px;background:rgba(239,107,107,.08);border:1px solid rgba(239,107,107,.2);color:var(--danger)}
.ln{margin:2px 0}.hd{font-weight:700;margin:10px 0 4px;color:var(--accent)}.li{padding-inline-start:12px}
.time{font-size:10px;color:var(--dim);margin-top:6px}
.acts{display:flex;gap:4px;margin-top:4px;opacity:0;transition:opacity .15s}
.msg:hover .acts{opacity:1}
.act{width:26px;height:26px;border-radius:6px;color:var(--dim);display:grid;place-items:center}
.act:hover{background:var(--panel-2);color:var(--text)}
.act svg{width:14px;height:14px}
.typing .avatar{animation:pulse 1.4s ease-in-out infinite}
.dots{display:flex;gap:4px;padding:13px 14px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;align-self:flex-start}
.dots span{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:bounce 1.2s infinite}
.dots span:nth-child(2){animation-delay:.12s}.dots span:nth-child(3){animation-delay:.24s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,70%,100%{transform:none;opacity:.35}35%{transform:translateY(-4px);opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,119,87,.35)}50%{box-shadow:0 0 0 6px rgba(217,119,87,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

.composer-zone{position:absolute;inset-inline:0;bottom:0;padding:24px 24px calc(20px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,var(--bg) 66%,transparent)}
.composer{max-width:900px;margin:0 auto}
.bar{display:flex;align-items:center;gap:7px;padding:8px;border:1px solid var(--line-strong);background:var(--panel);border-radius:18px;box-shadow:var(--shadow);transition:.18s}
.bar:focus-within{border-color:rgba(217,119,87,.55);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.bar input{flex:1;min-width:0;height:44px;border:0;outline:0;background:transparent;padding:0 10px;font-size:14px}
.bar input::placeholder{color:var(--dim)}
.send{width:40px;height:40px;border-radius:11px;background:var(--text);color:var(--bg);display:grid;place-items:center;transition:.18s}
.send:hover:not(:disabled){background:var(--accent);color:#fff}
.send:disabled{opacity:.35;cursor:not-allowed}
.hint{text-align:center;font-size:10px;color:var(--dim);margin-top:9px}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);background:var(--panel);border:1px solid var(--line-strong);padding:10px 18px;border-radius:12px;font-size:12.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:950}
.toast.show{opacity:1;transform:translate(-50%,0)}
.backdrop{display:none}

@media(max-width:900px){.sidebar{width:230px}.welcome h2{font-size:29px}}
@media(max-width:700px){
  .sidebar{position:fixed;top:0;bottom:0;inset-inline-start:0;width:80vw;max-width:300px;z-index:900;transform:translateX(100%);transition:transform .28s;padding-top:max(14px,env(safe-area-inset-top))}
  .sidebar.open{transform:none}
  .backdrop.on{display:block;position:fixed;inset:0;background:rgba(8,8,7,.55);z-index:899}
  .menu-btn{display:grid}.live{display:none}.topbar{padding:0 12px}
  .chat-inner{padding:28px 14px 150px}.welcome{margin-top:28px}.welcome h2{font-size:25px}
  .bubble{font-size:14px;max-width:calc(100vw - 74px)}
  .composer-zone{padding:12px}.bar input{font-size:16px}.hint{display:none}
  .sdel,.acts{opacity:1}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <div class="brand"><div class="mark"><img src="https://agro-synth.github.io/AgroSynth/1000007537.jpg" alt="" onerror="this.remove()"></div><span>AgroSynth</span></div>
    </div>
    <button class="new-chat" id="newChat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span>محادثة جديدة</span>
    </button>
    <div class="side-title">المحادثات السابقة</div>
    <div class="sessions" id="sessions"></div>
    <div class="side-footer">
      <button class="side-item" id="sideTheme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg><span>المظهر</span>
      </button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <header class="topbar">
      <div class="model">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="القائمة">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="model-btn">AgroSynth AI</div>
        <div class="live"><i></i><span>متصل</span></div>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="تبديل المظهر">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </header>

    <section class="chat" id="chat"><div class="chat-inner" id="inner"></div></section>

    <div class="composer-zone">
      <div class="composer">
        <div class="bar">
          <input id="input" type="text" maxlength="500" placeholder="اكتب سؤالك لـ AgroSynth…" autocomplete="off" aria-label="سؤالك">
          <button class="send" id="send" aria-label="إرسال">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div class="hint">قد يخطئ AgroSynth. تحقق دائماً من المعلومات المهمة.</div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const API = "https://ai.clubagritech.workers.dev";
const LOGO = "https://agro-synth.github.io/AgroSynth/1000007537.jpg";
const SUGGESTIONS = [
  ["ما أنسب موعد لزراعة الطماطم؟", '<path d="M12 22V12M12 12 3 7l9-5 9 5-9 5Z"/>'],
  ["كيف أعرف أن نباتاتي تحتاج الماء؟", '<path d="M12 3c3 4 6 7 6 10.5A6 6 0 0 1 6 13.5C6 10 9 7 12 3Z"/>'],
  ["اشرح لي التسميد المتوازن", '<path d="M9 3v4M15 3v4M4 11h16M6 11l1 10h10l1-10"/>'],
  ["ما هي أمراض الزيتون الشائعة؟", '<path d="M17 18a5 5 0 0 0-10 0"/><circle cx="12" cy="9" r="4"/><path d="M3 20h18"/>']
];

const $ = id => document.getElementById(id);
const inner = $("inner"), chat = $("chat"), input = $("input"), sendBtn = $("send");
let sessions = [], current = null, busy = false;

function load(){ try{ sessions = JSON.parse(localStorage.getItem("agro_sessions")||"[]"); }catch(e){ sessions=[]; } }
function save(){ try{ localStorage.setItem("agro_sessions", JSON.stringify(sessions.slice(0,30))); }catch(e){} }
function setTheme(t){ document.documentElement.dataset.theme=t; try{ localStorage.setItem("agro_theme",t); }catch(e){} }

function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2200); }
function clean(s){ return String(s||"").replace(/\*\*/g,"").replace(/\*/g,"").replace(/^#{1,6}\s*/gm,"").replace(/^\s*[-•]\s+/gm,"– ").replace(/`/g,"").trim(); }
function now(){ return new Date().toLocaleTimeString("ar-MA",{hour:"2-digit",minute:"2-digit"}); }
function avatar(bot){
  const a=document.createElement("div"); a.className="avatar";
  if(bot){ const i=new Image(); i.alt=""; i.onerror=()=>i.remove(); i.src=LOGO; a.appendChild(i); }
  else a.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.6-4 5-6 8-6s6.4 2 8 6"/></svg>';
  return a;
}
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }

function welcome(){
  inner.innerHTML = "";
  const w=document.createElement("div"); w.className="welcome";
  w.innerHTML='<div class="kicker">AGROSYNTH • الذكاء الفلاحي</div><h2>مرحباً بك في AgroSynth</h2><p>مساعدك الفلاحي الذكي. اسأل عن المحاصيل، التربة، السقي، التسميد والأمراض، وسأجيبك باختصار ووضوح.</p><div class="chips"></div>';
  const box=w.querySelector(".chips");
  SUGGESTIONS.forEach(([q,p])=>{
    const b=document.createElement("button"); b.className="chip";
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+p+'</svg><span></span>';
    b.querySelector("span").textContent=q; b.onclick=()=>send(q); box.appendChild(b);
  });
  inner.appendChild(w);
}

function addUser(text){
  const m=document.createElement("div"); m.className="msg user";
  const b=document.createElement("div"); b.className="bubble";
  const p=document.createElement("div"); p.textContent=text; b.appendChild(p);
  m.append(avatar(false), b); inner.appendChild(m); scrollDown();
}

function addBot(text, isErr){
  const m=document.createElement("div"); m.className="msg "+(isErr?"err":"bot");
  const b=document.createElement("div"); b.className="bubble";
  const t=clean(text);
  if(isErr){ b.textContent=t; }
  else{
    t.split(/\n+/).forEach(line=>{
      const l=line.trim(); if(!l) return;
      const d=document.createElement("div");
      d.className = (/:$/.test(l)&&l.length<60) ? "ln hd" : (/^(\d+[\.\)]|–)/.test(l) ? "ln li" : "ln");
      d.textContent=l; b.appendChild(d);
    });
    const tm=document.createElement("div"); tm.className="time"; tm.textContent=now(); b.appendChild(tm);
    const acts=document.createElement("div"); acts.className="acts";
    const c=document.createElement("button"); c.className="act"; c.title="نسخ"; c.setAttribute("aria-label","نسخ");
    c.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    c.onclick=async()=>{ try{ await navigator.clipboard.writeText(t); toast("تم النسخ"); }catch(e){ toast("تعذر النسخ"); } };
    acts.appendChild(c); b.appendChild(acts);
  }
  m.append(avatar(!isErr), b); inner.appendChild(m); scrollDown();
}

function showTyping(){
  const m=document.createElement("div"); m.className="msg bot typing"; m.id="typing";
  const d=document.createElement("div"); d.className="dots"; d.innerHTML="<span></span><span></span><span></span>";
  m.append(avatar(true), d); inner.appendChild(m); scrollDown();
}
function hideTyping(){ const t=$("typing"); if(t) t.remove(); }

function renderSessions(){
  const box=$("sessions"); box.innerHTML="";
  if(!sessions.length){ box.innerHTML='<div class="empty-note">لا توجد محادثات سابقة</div>'; return; }
  sessions.forEach(s=>{
    const r=document.createElement("div"); r.className="srow"+(s.id===current?" active":"");
    const t=document.createElement("span"); t.className="stitle"; t.textContent=s.title;
    const d=document.createElement("button"); d.className="sdel"; d.title="حذف"; d.setAttribute("aria-label","حذف");
    d.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m2 0-1 13a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2L7 7"/></svg>';
    d.onclick=e=>{ e.stopPropagation(); sessions=sessions.filter(x=>x.id!==s.id); save(); if(current===s.id) newChat(); else renderSessions(); toast("تم حذف المحادثة"); };
    r.onclick=()=>openSession(s.id); r.append(t,d); box.appendChild(r);
  });
}

function openSession(id){
  const s=sessions.find(x=>x.id===id); if(!s) return;
  current=id; inner.innerHTML="";
  s.messages.forEach(m=> m.role==="user" ? addUser(m.content) : addBot(m.content));
  renderSessions(); closeMenu();
}
function newChat(){ current=null; welcome(); renderSessions(); closeMenu(); input.focus(); }

async function send(text){
  text=(text||"").trim().slice(0,500);
  if(!text||busy) return;
  busy=true; sendBtn.disabled=true; input.value="";
  const w=inner.querySelector(".welcome"); if(w) w.remove();

  let s = sessions.find(x=>x.id===current);
  if(!s){ s={id:String(Date.now()),title:text.slice(0,40),messages:[]}; sessions.unshift(s); current=s.id; }
  addUser(text); s.messages.push({role:"user",content:text});
  showTyping();

  try{
    const res = await fetch(API+"/?q="+encodeURIComponent(text));
    const reply=(await res.text()).trim();
    hideTyping();
    if(!res.ok) throw new Error(reply||("HTTP "+res.status));
    const ans = reply || "لم يصلني رد من الخادم.";
    addBot(ans); s.messages.push({role:"assistant",content:ans});
  }catch(err){
    hideTyping(); addBot("حدث خطأ: "+err.message, true);
  }
  save(); renderSessions();
  busy=false; sendBtn.disabled=false; input.focus();
}

sendBtn.onclick=()=>send(input.value);
input.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.isComposing){ e.preventDefault(); send(input.value); } });
$("newChat").onclick=newChat;
const toggleTheme=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("themeBtn").onclick=toggleTheme; $("sideTheme").onclick=toggleTheme;
function openMenu(){ $("sidebar").classList.add("open"); $("backdrop").classList.add("on"); }
function closeMenu(){ $("sidebar").classList.remove("open"); $("backdrop").classList.remove("on"); }
$("menuBtn").onclick=openMenu; $("backdrop").onclick=closeMenu;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeMenu(); });

try{ const t=localStorage.getItem("agro_theme"); if(t) document.documentElement.dataset.theme=t; }catch(e){}
load(); renderSessions(); welcome(); input.focus();
</script>
</body>
</html>

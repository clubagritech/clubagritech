<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساعد نادي أغريتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0E4; --panel:#F7FAF4; --ink:#1C2B22; --muted:#5E7164;
  --forest:#21442F; --forest-2:#2F6444; --wheat:#C8A02B; --line:#CBD7C4;
  --user:#21442F; --user-ink:#F4F8EF; --bot:#FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101A14; --panel:#16231B; --ink:#E6EEE3; --muted:#93A89A;
    --forest:#7FC08F; --forest-2:#9ED3AB; --wheat:#E0B93F; --line:#2A3B30;
    --user:#2F6444; --user-ink:#F4F8EF; --bot:#1D2E23; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101A14; --panel:#16231B; --ink:#E6EEE3; --muted:#93A89A;
  --forest:#7FC08F; --forest-2:#9ED3AB; --wheat:#E0B93F; --line:#2A3B30;
  --user:#2F6444; --user-ink:#F4F8EF; --bot:#1D2E23; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex; justify-content:center;
}
.app{width:100%; max-width:820px; height:100%; display:flex; flex-direction:column; background:var(--panel); border-inline:1px solid var(--line)}
header{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;flex:none}
header h1{font-size:1.05rem; margin:0; font-weight:700}
header p{margin:2px 0 0; font-size:.8rem; color:var(--muted)}
.spacer{flex:1}
.icon-btn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit;font-size:.8rem}
.icon-btn:hover{border-color:var(--forest)}
:focus-visible{outline:2px solid var(--wheat); outline-offset:2px}

#log{flex:1; overflow-y:auto; padding:20px 18px; display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth}
.empty{margin:auto; text-align:center; max-width:30rem}
.empty h2{font-size:1.5rem; margin:0 0 8px; color:var(--forest)}
.empty p{margin:0 0 18px; color:var(--muted); line-height:1.8}
.chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.chip{border:1px solid var(--line); background:var(--bot); color:var(--ink); padding:8px 14px; border-radius:999px; cursor:pointer; font:inherit; font-size:.88rem}
.chip:hover{border-color:var(--wheat)}

.msg{max-width:85%; padding:11px 15px; border-radius:16px; line-height:1.85; white-space:pre-wrap; word-wrap:break-word; font-size:.97rem}
.msg.user{align-self:flex-start; background:var(--user); color:var(--user-ink); border-end-start-radius:4px}
.msg.bot{align-self:flex-end; background:var(--bot); border:1px solid var(--line); border-end-end-radius:4px}
.msg.err{border-color:#B3472F; color:#B3472F}
.dots{display:inline-flex; gap:5px; padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6} #log{scroll-behavior:auto}}

form{display:flex; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); align-items:flex-end}
textarea{flex:1; resize:none; max-height:160px; min-height:46px; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:var(--bot); color:var(--ink); font:inherit; line-height:1.6}
textarea:focus{outline:none; border-color:var(--forest)}
#send{background:var(--forest); color:var(--bg); border:0; border-radius:14px; padding:0 20px; height:46px; font:inherit; font-weight:700; cursor:pointer}
:root[data-theme="dark"] #send{color:#10201A}
#send:disabled{opacity:.5; cursor:default}
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <rect width="40" height="40" rx="11" fill="var(--forest)"/>
      <path d="M20 31V16" stroke="var(--wheat)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M20 21c-5 0-7-3-7-7 4 0 7 2 7 7z" fill="var(--wheat)"/>
      <path d="M20 17c0-4 2-7 7-7 0 4-2 7-7 7z" fill="var(--wheat)" opacity=".75"/>
    </svg>
    <div>
      <h1>مساعد نادي أغريتك</h1>
      <p>اسأل عن الزراعة، التربة، السقي والمحاصيل</p>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="clear" type="button">محادثة جديدة</button>
  </header>

  <main id="log" aria-live="polite"></main>

  <form id="form">
    <textarea id="input" rows="1" maxlength="500" placeholder="اكتب سؤالك هنا…" aria-label="رسالتك"></textarea>
    <button id="send" type="submit">إرسال</button>
  </form>
</div>

<script>
const CONFIG = {
  API_URL: "https://ai.clubagritech.workers.dev",
  SUGGESTIONS: [
    "ما أنسب موعد لزراعة الطماطم؟",
    "كيف أعرف أن نباتاتي تحتاج الماء؟",
    "اشرح لي التسميد المتوازن",
    "ما هي أمراض الزيتون الشائعة؟"
  ]
};

const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
let history = [];
let busy = false;

function showEmpty(){
  log.innerHTML = "";
  const d = document.createElement("div");
  d.className = "empty";
  d.innerHTML = "<h2>مرحباً بك في نادي أغريتك</h2><p>اطرح سؤالك الفلاحي وسيجيبك المساعد. جرّب أحد الأسئلة أدناه.</p>";
  const c = document.createElement("div"); c.className = "chips";
  CONFIG.SUGGESTIONS.forEach(s => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = s;
    b.onclick = () => send(s);
    c.appendChild(b);
  });
  d.appendChild(c); log.appendChild(d);
}

function add(role, text, extra){
  const e = log.querySelector(".empty"); if (e) e.remove();
  const m = document.createElement("div");
  m.className = "msg " + role + (extra ? " " + extra : "");
  m.textContent = text;
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return m;
}

async function send(text){
  text = (text || "").trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  add("user", text);
  history.push({role:"user", content:text});
  input.value = ""; input.style.height = "auto";

  const wait = add("bot", "");
  wait.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';

  try{
    const res = await fetch(CONFIG.API_URL + "/?q=" + encodeURIComponent(text.slice(0, 500)));
    const reply = (await res.text()).trim();
    if (!res.ok) throw new Error(reply || ("HTTP " + res.status));
    wait.textContent = reply || "لم يصلني رد من الخادم.";
    history.push({role:"assistant", content:reply});
  }catch(err){
    wait.className = "msg bot err";
    wait.textContent = "حدث خطأ: " + err.message;
    history.pop();
  }finally{
    busy = false; sendBtn.disabled = false; input.focus();
    log.scrollTop = log.scrollHeight;
  }
}

form.addEventListener("submit", e => { e.preventDefault(); send(input.value); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(input.value); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});
document.getElementById("clear").onclick = () => { history = []; showEmpty(); };
showEmpty();
</script>
</body>
</html>
